services:
  - type: web
    name: mediextract-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DEBUG
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: APP_NAME
        value: MediExtract AI Demo
      - key: DATABASE_NAME
        value: mediextract_demo